name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  TERRAFORM_VERSION: 1.14.4
  TOFU_VERSION: 1.12.6
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Validate every stack and module without a backend
        run: make validate TF=${{ matrix.tool }}
      - name: Run the terraform test suites of every module that has one
        run: make test TF=${{ matrix.tool }}
